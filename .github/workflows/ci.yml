name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy pytest pytest-asyncio
          pip install -r backend/requirements.txt

      - name: Lint with Flake8
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/app --count --max-line-length=140 --ignore=E501,W503 --statistics

      - name: Type Check with Mypy
        run: |
          mypy backend/app/services backend/app/agent/base_plugin.py --ignore-missing-imports

      - name: Run Pytest Unit Tests
        run: |
          cd backend
          pytest tests/ -v
